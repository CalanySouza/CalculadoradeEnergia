<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Energia</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculadora">
    <h1>Calculadora de Energia</h1>
    <section>
      <label for="potencia">Potência (W)</label>
      <input type="number" id="potencia" placeholder="Ex: 5500">

      <label for="horas">Horas de uso por dia</label>
      <input type="number" id="horas" placeholder="Ex: 1">

      <label for="dias">Dias de uso no mês</label>
      <input type="number" id="dias" placeholder="Ex: 30">

      <label for="tarifa">Tarifa por kWh (R$)</label>
      <input type="number" id="tarifa" step="0.01" placeholder="Ex: 0.90">

      <button id="calcular">Calcular</button>
      <button id="limpar" class="secundario">Limpar</button>
      <div id="resultado"></div>
  </div>
  </section>



  <script src="script.js"></script>
</body>

</html>
